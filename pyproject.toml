[project]
name = "plataforma-vimeo-mcp"
version = "0.1.0"
description = "POC: plataforma educacional operada por LLM via MCP, com acervo de vídeos no Vimeo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # 4.x traz MultiAuth e os providers de OAuth que o conector remoto exige.
    "fastmcp>=4.0,<5",
    # Onde o proxy OAuth guarda cliente e token entre um deploy e outro.
    "py-key-value-aio[postgresql]>=0.3",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    # EmailStr no login e na matrícula; hoje também vem pelo fastmcp, mas é uso direto.
    "email-validator>=2.0",
    "python-multipart>=0.0.12",
    # Recorta a margem branca das figuras que o LibreOffice converte: ele
    # devolve a folha A4 inteira com o desenho no meio.
    "pillow>=10",
    # XML de .docx que veio de fora: recusa DTD e entidade (a "billion laughs"
    # que a biblioteca padrão expande alegremente).
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["mcp"]

[tool.pytest.ini_options]
pythonpath = ["mcp"]
testpaths = ["mcp/tests"]
asyncio_mode = "auto"
