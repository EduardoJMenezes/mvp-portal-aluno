# A suíte inteira contra Postgres de verdade — a metade que depende do banco
# não roda em máquina sem Postgres, e é nela que moram as regras de publicação,
# segregação por turma e sessão.
name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # O Java sobe o próprio Postgres pelo Testcontainers, então não precisa do
  # service acima. O jar que ele produz é o mesmo que a suíte do MCP usa para
  # testar a ponte — construir duas vezes seria pagar dois minutos por nada.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/target/api-*-SNAPSHOT.jar
          retention-days: 1

  mcp:
    needs: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # só do container efêmero da CI
          POSTGRES_DB: plataforma_mvp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plataforma_mvp_test
      # A suíte sobe a API de verdade e fala HTTP com ela: desde a migração,
      # testar as tools sem este processo é testar o httpx. Sem API_JAR os
      # testes da ponte pulariam — e na CI pular passaria em silêncio, então
      # lá o conftest transforma a ausência em erro.
      API_BASE_URL: http://127.0.0.1:8080
      SERVICO_TOKEN: token-de-servico-so-da-ci-com-mais-de-32
      API_JAR: ${{ github.workspace }}/api-jar/api-0.0.1-SNAPSHOT.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: api-jar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        shell: bash
        # O resumo sai sempre, e o nome de cada teste que caiu vira anotação:
        # sem isso, quem não tem login no Actions só enxerga "exit code 1".
        run: |
          set +e
          python -m pytest mcp/tests -q -rs -rf | tee pytest.txt
          codigo=${PIPESTATUS[0]}
          echo "::notice title=pytest::$(tail -n 1 pytest.txt)"
          grep -E "^(FAILED|ERROR)" pytest.txt | head -20 | while IFS= read -r linha; do
            echo "::error title=teste::$linha"
          done
          exit "$codigo"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
