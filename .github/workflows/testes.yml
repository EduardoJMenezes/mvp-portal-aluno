# A suíte inteira contra Postgres de verdade — a metade que depende do banco
# não roda em máquina sem Postgres, e é nela que moram as regras de publicação,
# segregação por turma e sessão.
name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # só do container efêmero da CI
          POSTGRES_DB: plataforma_mvp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plataforma_mvp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        shell: bash # -eo pipefail: a falha do pytest não se perde no tee
        run: |
          python -m pytest backend/tests -q -rs | tee pytest.txt
          echo "::notice title=pytest::$(tail -n 1 pytest.txt)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
