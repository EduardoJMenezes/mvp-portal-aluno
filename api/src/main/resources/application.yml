spring:
  application:
    name: api
  jpa:
    # O schema é do Flyway. O Hibernate só confere se as entidades batem com ele.
    # Nunca `update`: ele não conhece o índice parcial nem o storage EXTERNAL do PDF.
    hibernate:
      ddl-auto: validate
    # Sem sessão aberta até a view: carregamento preguiçoso fora da transação
    # tem que falhar alto, não consultar escondido.
    open-in-view: false
  flyway:
    # Produção já tem o schema: marca como V1 sem executar. Banco vazio roda a V1.
    # Tem que ser 1 — com 0, a V1 rodaria em produção e bateria nas tabelas existentes.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    # O frontend e o adaptador MCP já falam snake_case com a API Python.
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      enabled: true

plataforma:
  token-de-servico: ${SERVICO_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
